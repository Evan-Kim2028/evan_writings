name: Link Check

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    name: Check external links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check links
        run: npm run check-links
        continue-on-error: true
        id: linkcheck

      - name: Create issue on broken links
        if: steps.linkcheck.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            let output;
            try {
              output = execSync('npm run check-links 2>&1', { encoding: 'utf8' });
            } catch (e) {
              output = e.stdout || e.message;
            }
            // Extract broken links section
            const brokenSection = output.split('BROKEN LINKS')[1] || output;
            const body = `## Broken External Links\n\nThe weekly link checker found broken links that need fixing.\n\n\`\`\`\n${brokenSection.trim()}\n\`\`\`\n\nRun \`npm run check-links\` locally to reproduce.\n\nGenerated by the [Link Check](../actions/workflows/link-check.yml) workflow.`;
            
            // Check if there's already an open issue for this
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['broken-links'],
              per_page: 1
            });
            
            if (issues.data.length > 0) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: body
              });
              console.log(`Updated existing issue #${issues.data[0].number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Broken external links detected',
                body: body,
                labels: ['broken-links', 'maintenance']
              });
              console.log('Created new issue');
            }
