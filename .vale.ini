StylesPath = styles
MinAlertLevel = warning

Packages = Google, write-good

# Inline code spans and YAML front-matter fields are not linted.
IgnoredScopes = code, tt, kbd, frontmatter

[*.md]
BasedOnStyles = Google, write-good, House

# Pipe-table rows (cell contents make sentence-scoped number rules
# like House.SentenceNumeral misfire).
BlockIgnores = (?m)(^[ \t]*\|[^\n\r]*$)

# Stock rules disabled as duplicates or noise (see docs/linting.md):
# - write-good.Passive / Google.Passive: House.PassiveVoice covers it at warning level.
# - write-good.E-Prime: flags every form of "to be" — noise.
# - Google.We / Google.FirstPerson: House.FirstPerson covers all first-person
#   pronouns at error level.
# - Google.EmDash: presumes dashes are allowed; House.EmDash bans them.
# - write-good.TooWordy: flags precise technical nouns (maximum, minimum,
#   requirement, utilization). House.Wordy keeps only the real filler.
write-good.TooWordy = NO
write-good.Passive = NO
write-good.E-Prime = NO
Google.Passive = NO
Google.We = NO
Google.FirstPerson = NO
Google.EmDash = NO

# First person is banned outright only in the Evals series, which is technical
# writing for an outside reader. Earlier posts are personal essays whose voice
# is first person by design, so there the rule only warns.
# Rules below are errors only in the Evals series, which is technical writing
# for an outside reader held to the full house style. Everywhere else they warn.
# The archive is published personal essays; making these errors would block
# every commit touching an old post without improving the writing.
House.FirstPerson = warning
House.BannedVocab = warning
House.FillerPhrases = warning
write-good.ThereIs = warning
Google.Exclamation = warning
Google.Slang = warning
Google.Latin = warning
Google.Units = warning
Google.Ordinal = warning
Google.DateFormat = warning
Google.Quotes = warning
Google.AMPM = warning
write-good.So = warning

[src/writings/{four-verifiable-properties-of-a-useful-agent-task,terminal-bench-task-lakehouse-schema-contract-drift}.md]
House.FirstPerson = error
House.BannedVocab = error
House.FillerPhrases = error
write-good.ThereIs = error
Google.Exclamation = error
Google.Slang = error
Google.Latin = error
Google.Units = error
Google.Ordinal = error
Google.DateFormat = error
Google.Quotes = error
Google.AMPM = error
write-good.So = error
